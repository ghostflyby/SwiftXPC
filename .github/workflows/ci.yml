name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    # Opt back into -warnings-as-errors; downstream package consumers never
    # see it (see Package.swift).
    env:
      SWIFTXPC_WARNINGS_AS_ERRORS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: swift format lint --strict -r Sources Tests Examples/DistributedXPCDemo/Sources
      - name: Build
        run: swift build --build-tests
      - name: Test
        # Catch cooperative-executor blocking even on runners with many cores.
        run: LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test
      - name: Verify external API and public symbol inventory
        run: python3 Scripts/check-public-api.py
      - name: Save API verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-api-verification
          path: .build/public-api-verification
          if-no-files-found: ignore

  demo:
    name: Build demo (out-of-package consumer)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build demo package
        run: swift build
        working-directory: Examples/DistributedXPCDemo
      - name: Test embedded XPC service addressing on both backends
        run: |
          bash Examples/DistributedXPCDemo/Scripts/build-demo-bundle.sh
          Examples/DistributedXPCDemo/.build/demo/DistributedXPCDemo.app/Contents/MacOS/DemoApp --retire
          Examples/DistributedXPCDemo/.build/demo/DistributedXPCDemo.app/Contents/MacOS/DemoApp --session --retire
      - name: Test C and Session server lifecycle and exit policy
        run: python3 Scripts/check-actor-service-lifecycle.py
