name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: swift format lint --strict -r Sources Tests Examples/DistributedXPCDemo/Sources
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  demo:
    name: Build demo (out-of-package consumer)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build demo package
        run: swift build
        working-directory: Examples/DistributedXPCDemo
